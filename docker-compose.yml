services:
  frontend-app:
    build:
      context: .
      target: builder
    working_dir: /app

  app:
    build:
      context: .
      target: runtime
    expose:
      - "80"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN:-kingbat-eum.kpearl.net}
      API_DOMAIN: ${API_DOMAIN:-api-kingbat-eum.kpearl.net}
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:11002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - envsubst '$$DOMAIN $$API_DOMAIN $$API_UPSTREAM' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    ports:
      - "80:80"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    environment:
      DOMAIN: ${DOMAIN:-kingbat-eum.kpearl.net}
      API_DOMAIN: ${API_DOMAIN:-api-kingbat-eum.kpearl.net}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    entrypoint:
      - certbot
    command:
      - certonly
      - --standalone
      - --non-interactive
      - --agree-tos
      - --email
      - ${CERTBOT_EMAIL:-}
      - -d
      - ${DOMAIN:-kingbat-eum.kpearl.net}
      - -d
      - ${API_DOMAIN:-api-kingbat-eum.kpearl.net}
